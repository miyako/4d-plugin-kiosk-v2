name: Ownership tests

on:
  pull_request:
    paths:
      - "support/**"
      - "4D Plugin API/**"
      - ".github/tests/ownership.cpp"
      - ".github/tests/test_ownership.py"
      - ".github/workflows/ownership.yml"
  push:
    branches: [main]
    paths:
      - "support/**"
      - "4D Plugin API/**"
      - ".github/tests/ownership.cpp"
      - ".github/tests/test_ownership.py"
      - ".github/workflows/ownership.yml"

permissions:
  contents: read

jobs:
  ownership:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run actual-source ownership regressions with ASan and UBSan
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s .github/tests -p test_ownership.py -v
